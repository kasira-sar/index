<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Identity</title>
<style>
  :root {
    --bg-deep: #12181f;
    --bg-panel: #1c2530;
    --bg-field: #263140;
    --gold: #e8b34d;
    --text-soft: #9aa7b6;
    --text-bright: #eef2f6;
    --hairline: #34404e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 15%, #1a2836 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #1a222e 0%, transparent 50%),
      var(--bg-deep);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--bg-panel);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 40px 44px 34px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55);
  }

  .card h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 0.5px;
    color: var(--gold);
    font-weight: 700;
  }

  .card .tagline {
    margin: 6px 0 30px;
    font-size: 13px;
    font-style: italic;
    color: var(--text-soft);
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 18px;
    margin-bottom: 22px;
  }

  .field {
    background: var(--bg-field);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 12px 16px;
  }

  .field .label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-soft);
    margin-bottom: 4px;
  }

  .field .value {
    font-size: 16px;
    color: var(--text-bright);
    font-weight: 600;
  }

  .doc-root {
    border: 1px solid #4d3d20;
    background: rgba(232, 179, 77, 0.08);
    border-radius: 8px;
    padding: 12px 16px;
  }

  .doc-root .label {
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .doc-root .path {
    font-family: "Consolas", monospace;
    font-size: 14px;
    color: var(--gold);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Server Identity</h1>
    <p class="tagline">Cloud Infrastructure &amp; EBS Management</p>

    <div class="grid">
      <div class="field">
        <div class="label">Student name</div>
        <div class="value">Kasira Sarimarnond</div>
      </div>
      <div class="field">
        <div class="label">Student ID</div>
        <div class="value">1660701234</div>
      </div>
      <div class="field">
        <div class="label">Machine ID</div>
        <div class="value">Machine-111</div>
      </div>
      <div class="field">
        <div class="label">EBS disk size</div>
        <div class="value">10 GB</div>
      </div>
    </div>

    <div class="doc-root">
      <div class="label">Document root (current web path)</div>
      <div class="path">/data1660701234</div>
    </div>
  </div>
</body>
</html>
